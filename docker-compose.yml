name: caderninho
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: caderninho
      POSTGRES_PASSWORD: caderninho_local
      POSTGRES_DB: caderninho
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caderninho -d caderninho"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres_data:

